# _config.yaml
title: e-kavallieri Helm charts
description: >-
  Helm charts for the linuxserver.io container images, generated from their
  upstream documentation. Each chart is a thin values file over a shared
  base-chart that deploys the image as a StatefulSet.
theme: minima
url: "https://ekavallieri.github.io/public-helm-charts"
# Must match the alias in the `helm repo add <alias> <url>` snippet on index.md.
repo_name: ekavallieri

exclude:
  - Gemfile
  - Gemfile.lock
  - .gitignore
